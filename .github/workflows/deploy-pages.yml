name: Deploy Next.js (next-on-pages) to Cloudflare Pages

on:
  push:
    branches: ['main']           # ✅ keep your push deploys
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        required: true
        default: "preview"
        type: choice
        options: [preview, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # These are made available to the shell scripts below
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
      WORKER_VARS_JSON: ${{ secrets.WORKER_VARS_JSON }}
      WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (Yarn)
        run: |
          if [ -f yarn.lock ]; then
            (yarn install --immutable) || (yarn install --frozen-lockfile) || (yarn install)
          else
            yarn install
          fi

      # push -> production, manual -> inputs.env
      - name: Set DEPLOY_ENV
        run: echo "DEPLOY_ENV=${{ github.event_name == 'push' && 'production' || inputs.env }}" >> "$GITHUB_ENV"

      - name: Export build-time vars
        if: env.WORKER_VARS_JSON != ''
        run: |
          echo "$WORKER_VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Export all secret build-time vars
        if: env.WORKER_SECRETS_JSON != ''
        run: |
          echo "Attempting to parse and export secrets from WORKER_SECRETS_JSON..."

          # FIX: Always quote shell variables to prevent special characters from breaking the script.
          if [ -z "$WORKER_SECRETS_JSON" ] || [ "$WORKER_SECRETS_JSON" = "{}" ]; then
            echo "::warning::WORKER_SECRETS_JSON is empty. No secrets to export."
            exit 0
          fi
          
          # FIX: Quoting "$WORKER_SECRETS_JSON" ensures the entire JSON string is passed to jq.
          echo "$WORKER_SECRETS_JSON" | jq -r 'to_entries[] | .key + "=" + .value' > secrets.env
          
          if ! grep -q "NEXT_PUBLIC_AGENT_ID" secrets.env; then
            echo "::error::Failed to find NEXT_PUBLIC_AGENT_ID in the parsed secrets!"
            exit 1
          fi

          cat secrets.env >> "$GITHUB_ENV"
          echo "Successfully exported secrets to environment."

      - name: Build (next-on-pages)
        run: yarn dlx @cloudflare/next-on-pages@latest

      # ⚠️ Use a shell step (wrangler-action can't parse it)
      - name: Ensure Pages project exists
        run: |
          yarn dlx wrangler@4 pages project create "${CF_PAGES_PROJECT}" --production-branch main || echo "project exists"

      - name: Put Pages secrets (from WORKER_SECRETS_JSON)
        if: env.WORKER_SECRETS_JSON != ''
        run: |
          # sanity: show who wrangler thinks you are + which account
          yarn dlx wrangler@4 whoami

          # push bundled secrets into the Pages project
          echo "$WORKER_SECRETS_JSON"             | jq -r 'to_entries[] | @base64'             | while read -r line; do
                pair=$(echo "$line" | base64 -d)
                key=$(echo "$pair" | jq -r '.key')
                val=$(echo "$pair" | jq -r '.value')

                # wrangler reads CF_API_TOKEN / CF_ACCOUNT_ID from env
                printf "%s" "$val" | yarn dlx wrangler@4 pages secret put "$key" --project-name "${CF_PAGES_PROJECT}"
              done

      - name: Deploy to Pages (production)
        if: env.DEPLOY_ENV == 'production'
        id: deploy_prod
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name "${{ env.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true

      - name: Deploy to Pages (preview)
        if: env.DEPLOY_ENV != 'production'
        id: deploy_prev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name "${{ env.CF_PAGES_PROJECT }}" --branch ${{ github.ref_name }} --commit-dirty=true

      - name: Output deployment URLs
        run: |
          echo "Production: https://${{ env.CF_PAGES_PROJECT }}.pages.dev"
          echo "Preview (branch): https://${{ github.ref_name }}.${{ env.CF_PAGES_PROJECT }}.pages.dev"
